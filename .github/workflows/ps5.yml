name: PS5 Price Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ps5-price-bot
  cancel-in-progress: true

jobs:
  check-ps5-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4
          python -c "import requests; import bs4; print('Packages installed successfully')"

      - name: Search for PS5 deals
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ps5_bot.py

      - name: Save alerted PS5 deals
        run: |
          if [ -f seen_ps5_deals.json ]; then
            git config user.name "ps5-price-bot"
            git config user.email "ps5-price-bot@users.noreply.github.com"
            git add seen_ps5_deals.json
            git diff --cached --quiet || git commit -m "Update alerted PS5 deals"
            git push || true
          fi
