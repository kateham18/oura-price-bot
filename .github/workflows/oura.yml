name: Oura Price Bot

on:
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests

      - name: Run Oura bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python oura_bot.py
