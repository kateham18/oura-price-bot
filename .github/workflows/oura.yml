name: Oura Price Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests

      - name: Search for Gold Oura Ring 5
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python oura_bot.py

      - name: Save alerted deals
        run: |
          if [ -f seen_deals.json ]; then
            git config user.name "oura-price-bot"
            git config user.email "oura-price-bot@users.noreply.github.com"
            git add seen_deals.json
            git diff --cached --quiet || git commit -m "Update alerted Oura deals"
            git push || true
          fi
